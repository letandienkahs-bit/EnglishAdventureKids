name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Java 17
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # =========================
      # Android packages
      # =========================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================
      # Download Godot
      # =========================
      - name: Download Godot
        run: |
          curl -L -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip

          unzip -q godot.zip

          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          godot --version

      # =========================
      # Export templates
      # =========================
      - name: Download Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable

          curl -L -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz

          unzip -q templates.tpz -d /tmp/godot_templates

          cp -r /tmp/godot_templates/templates/* \
            ~/.local/share/godot/export_templates/4.4.1.stable/

      # =========================
      # Configure Godot Android paths
      # =========================
      - name: Configure Godot Android
        run: |
          mkdir -p .godot/editor

          cat > .godot/editor/editor_settings-4.tres <<EOF
          [gd_resource format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          EOF

          echo "===== GODOT ANDROID SETTINGS ====="
          cat .godot/editor/editor_settings-4.tres

      # =========================
      # Import project
      # =========================
      - name: Import project
        run: |
          godot --headless \
            --editor \
            --path . \
            --quit

      # =========================
      # Check Godot environment
      # =========================
      - name: Check Android environment
        run: |
          echo "===== JAVA ====="
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "===== SDK CONTENT ====="
          ls -la "$ANDROID_SDK_ROOT" || true

          echo "===== GODOT ====="
          godot --version

      # =========================
      # Build APK
      # =========================
      - name: Debug Android paths
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== JAVA ==="
          ls -la "$JAVA_HOME" || true

          echo "=== ANDROID SDK ==="
          ls -la "$ANDROID_SDK_ROOT" || true

          echo "=== SDKMANAGER ==="
          which sdkmanager || true

          echo "=== PLATFORM ==="
          ls -la "$ANDROID_SDK_ROOT/platforms" || true

          echo "=== BUILD TOOLS ==="
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true
          
      - name: Build Android APK
        run: |
          set -e

          mkdir -p build

          godot --headless \
            --path . \
            --export-debug "Android" \
            build/EnglishAdventureKids.apk

          echo "===== APK RESULT ====="
          ls -lah build/

      # =========================
      # Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAdventureKids-Android
          path: build/EnglishAdventureKids.apk
          if-no-files-found: error

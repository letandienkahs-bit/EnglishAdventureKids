
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. Java 17
      # ========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================
      # 3. Android SDK
      # ========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ========================================
      # 4. Android environment
      # ========================================
      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"


      # ========================================
      # 5. Android SDK packages
      # ========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "===== INSTALLED SDK ====="
          sdkmanager --list_installed


      # ========================================
      # 6. Download Godot 4.4.1
      # ========================================
      - name: Download Godot
        shell: bash
        run: |
          curl -fL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip

          unzip -q godot.zip

          sudo mv \
            Godot_v4.4.1-stable_linux.x86_64 \
            /usr/local/bin/godot

          sudo chmod +x /usr/local/bin/godot

          godot --version


      # ========================================
      # 7. Download Godot export templates
      # ========================================
      - name: Download Godot export templates
        shell: bash
        run: |
          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable"

          curl -fL -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q templates.tpz \
            -d /tmp/godot_templates

          cp -r \
            /tmp/godot_templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"


      # ========================================
      # 8. IMPORTANT:
      #    Create GLOBAL Godot Editor Settings
      # ========================================
      - name: Configure Godot Android SDK and JDK
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

          echo "===== GODOT GLOBAL SETTINGS ====="
          cat "$HOME/.config/godot/editor_settings-4.tres"


      # ========================================
      # 9. Verify Java / Android / Godot
      # ========================================
      - name: Verify build environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          echo "===== ANDROID ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "===== GODOT ====="
          godot --version

          echo "===== SDK DIRECTORY ====="
          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK OK"
          echo "Java OK"
          echo "Godot OK"


      # ========================================
      # 10. Import project
      # ========================================
      - name: Import project
        shell: bash
        run: |
          godot \
            --headless \
            --editor \
            --path . \
            --quit


      # ========================================
      # 11. Build APK
      # ========================================
      - name: Check Android configuration
        run: |
          echo "===== ANDROID ENV ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
      
          echo "===== SDK ====="
          test -d "$ANDROID_SDK_ROOT" && echo "SDK directory OK"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35" && echo "Android 35 OK"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" && echo "Build Tools OK"
      
          echo "===== GODOT SETTINGS ====="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
      
          echo "===== EXPORT PRESET ====="
          cat export_presets.cfg
      - name: Build Android APK
        run: |
          set -e
          mkdir -p build
      
          godot --headless --path . \
            --verbose \
            --export-debug "Android" \
            build/EnglishAdventureKids.apk


      # ========================================
      # 12. Upload APK
      # ========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAdventureKids-Android
          path: build/EnglishAdventureKids.apk
          if-no-files-found: error
